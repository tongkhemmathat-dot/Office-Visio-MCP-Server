[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "office-visio-mcp-server"
version = "1.0.1"
description = "MCP server for manipulating Microsoft Visio documents"
readme = "README.md"
license = {file = "LICENSE"}
authors = [
    {name = "GongRzhe", email = "gongrzhe@gmail.com"}
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
]
requires-python = ">=3.8"
dependencies = [
    "pywin32>=305",
    "mcp[cli]>=1.2.0,<2",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
# Visio's COM layer raises benign SEH exceptions that faulthandler would print as "fatal"
addopts = "-p no:faulthandler"

[project.urls]
"Homepage" = "https://github.com/GongRzhe/Office-Visio-MCP-Server"
"Bug Tracker" = "https://github.com/GongRzhe/Office-Visio-MCP-Server/issues"

[tool.hatch.build]
packages = ["visio_mcp_server"]

[project.scripts]
visio_mcp_server = "visio_mcp_server.visio_server:main"
